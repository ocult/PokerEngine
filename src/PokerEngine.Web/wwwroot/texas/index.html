<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PokerEngine - Texas Hold'em</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <nav class="topbar">
      <a href="/">Avaliar mão</a>
      <a href="/texas/">Texas Hold'em</a>
    </nav>

    <main class="container">
      <h1>Texas Hold'em</h1>

      <section class="card">
        <h2>Executar partida</h2>
        <form id="texas-form">
          <label for="players">Jogadores</label>
          <input id="players" name="players" type="number" min="1" max="9" value="2" />
          <button type="submit">Executar</button>
        </form>
        <pre id="texas-result">Resultado aparecerá aqui.</pre>
      </section>
    </main>

    <script src="/js/texas.js"></script>
  </body>
</html>
