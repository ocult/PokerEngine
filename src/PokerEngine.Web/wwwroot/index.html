<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PokerEngine Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>PokerEngine Web</h1>

      <section class="card">
        <h2>Avaliar mão</h2>
        <form id="hand-form">
          <label for="cards">Cartas</label>
          <input id="cards" name="cards" value="AC, KC, QH, JD, 10S" />
          <button type="submit">Avaliar</button>
        </form>
        <pre id="hand-result">Resultado aparecerá aqui.</pre>
      </section>

      <section class="card">
        <h2>Texas Hold'em</h2>
        <form id="texas-form">
          <label for="players">Jogadores</label>
          <input id="players" name="players" type="number" min="1" max="9" value="2" />
          <button type="submit">Executar</button>
        </form>
        <pre id="texas-result">Resultado aparecerá aqui.</pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
